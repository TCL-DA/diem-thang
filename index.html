<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17191d">
  <title>Điểm tháng · Tổ điện</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=8">
  <link rel="stylesheet" href="in.css?v=2">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <canvas id="nen-hat" aria-hidden="true"></canvas>
  <div class="thanh-cuon" id="thanh-cuon" aria-hidden="true"></div>

  <header class="dau" id="dau">
    <a class="logo" href="#home" aria-label="Điểm tháng — trang chủ">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="logo-vong"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity=".35"/><path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Điểm tháng <b>· Tổ điện</b></span>
    </a>
    <nav class="tab" id="tab" aria-label="Chọn người" hidden></nav>
    <div class="cong-cu" id="cong-cu" hidden>
      <nav class="thang" id="chon-thang" aria-label="Chọn tháng"></nav>
      <button class="nut-phu" id="nut-hu" type="button" aria-pressed="true" title="Bật / tắt hiệu ứng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <span>Hiệu ứng</span>
      </button>
      <button class="nut-phu" id="nut-pdf" type="button" title="Xuất PDF A4 có màu (trang đang xem; ở Home là cả tổ)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5M12 11v6M9 14l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>PDF</span>
      </button>
      <button class="nut-phu" id="nut-khoa" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Khoá lại</span>
      </button>
    </div>
  </header>

  <main id="chinh">
    <section class="man-khoa" id="man-khoa">
      <div class="khoa-hop">
        <svg class="khoa-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="21" width="28" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path class="khoa-quai" d="M16 21v-6a8 8 0 0 1 16 0v6" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="24" cy="31" r="2.6" fill="currentColor"/></svg>
        <p class="nhan">Riêng tư · đã mã hoá</p>
        <h1 class="display"><span>Điểm</span> <span>tháng</span> <span>tổ</span> <span>điện.</span></h1>
        <p class="than">Điểm thẻ việc trên Trello của tổ điện. Số liệu mã hoá, mở bằng mật khẩu.</p>
        <form class="mo" id="form-mo" autocomplete="off" onsubmit="return false">
          <label class="an-nhan" for="mat-khau">Mật khẩu</label>
          <input id="mat-khau" type="password" inputmode="numeric" maxlength="32" placeholder="Mật khẩu" autocomplete="new-password" spellcheck="false">
          <button class="nut" id="nut-mo" type="submit"><span>Mở</span></button>
        </form>
        <p class="bao" id="bao" role="status" aria-live="polite"></p>
      </div>
    </section>

    <div id="noi-dung" hidden></div>
  </main>

  <nav class="tab-duoi" id="tab-duoi" aria-label="Chọn người" hidden></nav>
  <div class="toast-khu" id="toast" role="status" aria-live="polite"></div>
  <button class="len-dau" id="len-dau" type="button" aria-label="Lên đầu trang"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

  <script src="app.js?v=11" type="module"></script>
</body>
</html>
